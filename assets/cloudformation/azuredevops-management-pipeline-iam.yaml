---
AWSTemplateFormatVersion: "2010-09-09"
Description: Provision the IAM roles required for Azure DevOps CI Pipelines in the management account

# Deployed directly to the management account only - this is the sole account where Azure
# DevOps' OIDC provider is trusted, since a single authenticated Azure DevOps pipeline task
# cannot independently re-federate into multiple AWS accounts. These roles are additionally
# granted an "allow-primary-assume-role" policy so they can chain into the counterpart roles
# in every other (spoke) account, which trust this account's roles via sts:AssumeRole instead
# of federating OIDC directly - see azuredevops-pipeline-iam.yaml.
#
# The AssumeRolePolicyDocument below is rendered as a JSON string via Fn::Sub, rather than as
# native CloudFormation YAML mapping keys (as used in github-pipeline-iam.yaml and
# gitlab-pipeline-iam.yaml). This is a deliberate exception, not a stylistic drift: the
# condition keys must be built from the IdentityProviderName parameter's value (e.g.
# "<IdentityProviderName>:aud"/"<IdentityProviderName>:sub"), and that value is only known at
# deploy time (Azure DevOps' OIDC issuer is
# per-organisation - https://vstoken.dev.azure.com/<organisation-id> - unlike GitHub/GitLab's
# fixed hostnames, which is why those templates can hardcode the condition key literally).
# CloudFormation's native YAML mapping keys cannot be built from a parameter, so Fn::Sub over a
# raw JSON string is the only way to make the condition key dynamic.

Parameters:
  AzureDevOpsServiceConnection:
    Description: The Azure DevOps organisation/project/service-connection for the read-write role, e.g. 'my-org/my-project/cloudaccess'. The read-only role's service connection is this value suffixed with '-ro'.
    Type: String
  CloudAccessRoleReadWriteName:
    Description: The name of the cloud access IAM Role used for provisioning resources
    Type: String
  CloudAccessRoleReadOnlyName:
    Description: The name of the cloud access IAM Role used for validating changes
    Type: String
  IdentityProviderName:
    Description: The name of the OIDC Identity Provider, e.g. vstoken.dev.azure.com/<organisation-id>
    Type: String
  TerraformStateKey:
    Description: The terraform state used by the cloud access roles
    Type: String
  TerraformStateRWPolicyName:
    Description: The name of the Terraform State Read Write IAM Policy
    Type: String
  TerraformStateROPolicyName:
    Description: The name of the Terraform State Read Only IAM Policy
    Type: String

Resources:
  TFStatePolicyReadWrite:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: !Ref TerraformStateRWPolicyName
      Description: "Provides the permissions for cloudaccess to read and write to the terraform state"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowS3Buckets
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate"
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate/*"
          - Sid: AllowS3Objects
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate/$${TerraformStateKey}"
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate/$${TerraformStateKey}.tflock"

  TFStatePolicyReadOnly:
    Type: "AWS::IAM::ManagedPolicy"
    Properties:
      ManagedPolicyName: !Ref TerraformStateROPolicyName
      Description: "Provides the permissions for cloudaccess to read the terraform state"
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowS3Buckets
            Effect: Allow
            Action:
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate"
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate/*"
          - Sid: AllowS3RemoteState
            Effect: Allow
            Action:
              - s3:HeadObject
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate/$${TerraformStateKey}"
          - Sid: AllowS3Objects
            Effect: Allow
            Action:
              - s3:DeleteObject
              - s3:GetObject
              - s3:ListBucket
              - s3:PutObject
            Resource:
              - !Sub "arn:aws:s3:::$${AWS::AccountId}-$${AWS::Region}-tfstate/$${TerraformStateKey}.tflock"

  CloudAccessRoleReadWrite:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref CloudAccessRoleReadWriteName
      Description: Used by cloudaccess to provision iam roles for pipelines across accounts
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAssumeRoleWithWebIdentity",
              "Effect": "Allow",
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Principal": {
                "Federated": "arn:aws:iam::$${AWS::AccountId}:oidc-provider/$${IdentityProviderName}"
              },
              "Condition": {
                "StringEquals": {
                  "$${IdentityProviderName}:aud": "api://AzureADTokenExchange",
                  "$${IdentityProviderName}:sub": "sc://$${AzureDevOpsServiceConnection}"
                }
              }
            }
          ]
        }
      ManagedPolicyArns:
        - !Ref TFStatePolicyReadWrite
        - arn:aws:iam::aws:policy/AWSCloudFormationFullAccess
        - arn:aws:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSSSODirectoryReadOnly
        - arn:aws:iam::aws:policy/AWSSSOReadOnly
        - arn:aws:iam::aws:policy/AmazonSNSFullAccess
        - arn:aws:iam::aws:policy/CloudWatchFullAccess
        - arn:aws:iam::aws:policy/IAMFullAccess
      Path: "/"
      Policies:
        - PolicyName: allow-readonly-kms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadonlyKMS
                Effect: Allow
                Action:
                  - "kms:DescribeKey"
                  - "kms:GetKeyRotationStatus"
                  - "kms:ListAliases"
                  - "kms:ListKeys"
                  - "kms:ListResourceTags"
                  - "kms:ListRetirableGrants"
                Resource: "*"

        - PolicyName: allow-sns
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowSNS
                Effect: Allow
                Action:
                  - "sns:CreateTopic"
                  - "sns:DeleteTopic"
                  - "sns:GetTopicAttributes"
                  - "sns:ListSubscriptionsByTopic"
                  - "sns:ListTopics"
                  - "sns:Publish"
                  - "sns:Subscribe"
                  - "sns:TagResource"
                  - "sns:UntagResource"
                Resource: "*"

        - PolicyName: allow-eventbridge
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowEventBridge
                Effect: Allow
                Action:
                  - "events:DeleteRule"
                  - "events:DescribeRule"
                  - "events:DisableRule"
                  - "events:EnableRule"
                  - "events:ListRuleNamesByTarget"
                  - "events:ListRules"
                  - "events:ListTagsForResource"
                  - "events:ListTargetsByRule"
                  - "events:PutEvents"
                  - "events:PutRule"
                  - "events:PutTargets"
                  - "events:RemoveTargets"
                  - "events:TagResource"
                  - "events:UntagResource"
                Resource: "*"

        - PolicyName: allow-readonly-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadonlySecrets
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:GetResourcePolicy"
                  - "secretsmanager:DescribeSecret"
                  - "secretsmanager:ListSecrets"
                Resource: "*"

        - PolicyName: allow-readwrite-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadWriteLambda
                Effect: Allow
                Action:
                  - "lambda:AddPermission"
                  - "lambda:CreateAlias"
                  - "lambda:CreateFunction"
                  - "lambda:DeleteAlias"
                  - "lambda:DeleteFunction"
                  - "lambda:Get*"
                  - "lambda:ListAliases"
                  - "lambda:ListFunctions"
                  - "lambda:ListVersionsByFunction"
                  - "lambda:PublishVersion"
                  - "lambda:RemovePermission"
                  - "lambda:TagResource"
                  - "lambda:UntagResource"
                  - "lambda:UpdateAlias"
                  - "lambda:UpdateFunctionCode"
                  - "lambda:UpdateFunctionConfiguration"
                Resource: "*"

        - PolicyName: allow-primary-assume-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowPrimaryAssumeRole
                Effect: Allow
                Action:
                  - "sts:AssumeRole"
                Resource: !Sub "arn:aws:iam::*:role/$${CloudAccessRoleReadWriteName}"
      Tags:
%{ for key, value in tags ~}
        - Key: ${key}
          Value: ${value}
%{ endfor ~}
        - Key: Name
          Value: !Ref CloudAccessRoleReadWriteName
        - Key: aws-cloudformation-stack-id
          Value: !Ref "AWS::StackId"
        - Key: aws-cloudformation-stack-name
          Value: !Ref "AWS::StackName"

  CloudAccessRoleReadOnly:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref CloudAccessRoleReadOnlyName
      Description: Used by cloudaccess to validate the provisioning of roles for pipelines
      AssumeRolePolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Sid": "AllowAssumeRoleWithWebIdentity",
              "Effect": "Allow",
              "Action": "sts:AssumeRoleWithWebIdentity",
              "Principal": {
                "Federated": "arn:aws:iam::$${AWS::AccountId}:oidc-provider/$${IdentityProviderName}"
              },
              "Condition": {
                "StringEquals": {
                  "$${IdentityProviderName}:aud": "api://AzureADTokenExchange",
                  "$${IdentityProviderName}:sub": "sc://$${AzureDevOpsServiceConnection}-ro"
                }
              }
            }
          ]
        }
      ManagedPolicyArns:
        - !Ref TFStatePolicyReadOnly
        - arn:aws:iam::aws:policy/AWSCloudFormationReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSOrganizationsReadOnlyAccess
        - arn:aws:iam::aws:policy/AWSSSODirectoryReadOnly
        - arn:aws:iam::aws:policy/AWSSSOReadOnly
        - arn:aws:iam::aws:policy/AmazonSNSReadOnlyAccess
        - arn:aws:iam::aws:policy/CloudWatchReadOnlyAccess
        - arn:aws:iam::aws:policy/IAMReadOnlyAccess
      Path: "/"
      Policies:
        - PolicyName: allow-readonly-kms
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadonlyKMS
                Effect: Allow
                Action:
                  - "kms:DescribeKey"
                  - "kms:GetKeyRotationStatus"
                  - "kms:ListAliases"
                  - "kms:ListKeys"
                  - "kms:ListResourceTags"
                  - "kms:ListRetirableGrants"
                Resource: "*"

        - PolicyName: allow-readonly-eventbridge
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadonlyEventBridge
                Effect: Allow
                Action:
                  - "events:DescribeRule"
                  - "events:ListRuleNamesByTarget"
                  - "events:ListRules"
                  - "events:ListTagsForResource"
                  - "events:ListTargetsByRule"
                Resource: "*"

        - PolicyName: allow-readonly-sns
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadonlySNS
                Effect: Allow
                Action:
                  - "sns:GetTopicAttributes"
                  - "sns:ListSubscriptionsByTopic"
                  - "sns:ListTopics"
                Resource: "*"

        - PolicyName: allow-readonly-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadonlySecrets
                Effect: Allow
                Action:
                  - "secretsmanager:GetSecretValue"
                  - "secretsmanager:GetResourcePolicy"
                  - "secretsmanager:DescribeSecret"
                  - "secretsmanager:ListSecrets"
                Resource: "*"

        - PolicyName: allow-readonly-lambda
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowReadonlyLambda
                Effect: Allow
                Action:
                  - "lambda:Get*"
                  - "lambda:List*"
                Resource: "*"

        - PolicyName: allow-primary-assume-role
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: AllowPrimaryAssumeRole
                Effect: Allow
                Action:
                  - "sts:AssumeRole"
                Resource: !Sub "arn:aws:iam::*:role/$${CloudAccessRoleReadOnlyName}"
      Tags:
%{ for key, value in tags ~}
        - Key: ${key}
          Value: ${value}
%{ endfor ~}
        - Key: Name
          Value: !Ref CloudAccessRoleReadOnlyName
        - Key: aws-cloudformation-stack-id
          Value: !Ref "AWS::StackId"
        - Key: aws-cloudformation-stack-name
          Value: !Ref "AWS::StackName"
